[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pcb"
version = "0.1.0"
description = "AD26 AI-assisted PCB auto-placement"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "shapely>=2,<3",
  "fastapi>=0.115",
  "jinja2>=3.1",
]

[project.optional-dependencies]
eda = ["eda-agent==0.8.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
